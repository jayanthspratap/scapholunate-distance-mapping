<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f7f6f3'/%3E%3Cpath d='M11 5v22' stroke='%23443a2e' stroke-width='4'/%3E%3Cpath d='M21 5v22' stroke='%2321918c' stroke-width='4'/%3E%3C/svg%3E">
<title>Scapholunate distance</title>
<meta name="description" content="Interactive 3D maps of the scapholunate interval from CT, in 25 wrists with scapholunate interosseous ligament injury.">
<style>
  :root {
    --bg:    #f7f6f3;
    --panel: #ffffff;
    --fg:    #1b1a18;
    --dim:   #6d6a64;
    --faint: #6d6a64;
    --line:  #ddd9d1;
    --match: #0f7f9b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 400 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  canvas { display: block; touch-action: none; }
  #stage { position: fixed; inset: 0; }

  .ui { position: fixed; z-index: 2; }
  .ui, .ui * { -webkit-user-select: none; user-select: none; }
  button, select, input { font: inherit; }
  :focus-visible { outline: 2px solid var(--match); outline-offset: 2px; border-radius: 6px; }

  #title, #legend { text-shadow: 0 1px 2px var(--bg), 0 0 6px var(--bg); }
  #title { top: 20px; left: 24px; pointer-events: none; }
  #title h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  #title p  { margin: 3px 0 0; font-size: 12px; color: var(--dim);
              font-variant-numeric: tabular-nums; }

  #controls { top: 18px; right: 24px; display: flex; gap: 8px; align-items: center; }
  .group { display: flex; align-items: stretch; background: var(--panel);
           border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .group > * { border: 0; background: transparent; color: var(--dim); cursor: pointer;
               padding: 6px 12px; font-size: 12px; }
  .group > * + * { border-left: 1px solid var(--line); }
  .group button:hover:not(:disabled) { background: #f1efe9; color: var(--fg); }
  .group button:disabled { opacity: .3; cursor: default; }
  .group button[aria-pressed="true"] { background: #ece9e1; color: var(--fg); font-weight: 500; }
  #who { color: var(--fg); font-variant-numeric: tabular-nums; min-width: 78px;
         text-align: center; cursor: pointer; padding: 6px 4px; }
  #whoWrap { position: relative; display: flex; }
  #pick { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }

  #legend { left: 24px; bottom: 22px; pointer-events: none; max-width: 340px; }
  #ramp { width: 172px; height: 7px; border-radius: 4px;
          box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
  #legend .row { display: flex; justify-content: space-between; width: 172px; margin-top: 5px;
                 font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #legend .cap { font-size: 11px; color: var(--dim); margin-bottom: 6px; }
  #scalebar { display: flex; align-items: center; gap: 7px; margin-bottom: 12px;
              font-size: 11px; color: var(--dim); }
  #sbLine { height: 1px; background: var(--dim); position: relative; }
  #sbLine::before, #sbLine::after { content: ""; position: absolute; top: -3px;
              width: 1px; height: 7px; background: var(--dim); }
  #sbLine::before { left: 0; } #sbLine::after { right: 0; }
  #note { margin: 14px 0 0; font-size: 11px; line-height: 1.55; color: var(--faint); }

  #slicePanel { right: 24px; bottom: 22px; width: 268px; }
  #sliceBox { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
              padding: 10px 12px 6px; }
  #sliceHead { display: flex; justify-content: space-between; align-items: baseline;
               font-size: 11px; color: var(--dim); margin-bottom: 4px;
               font-variant-numeric: tabular-nums; }
  #sliceSvg { display: block; width: 100%; height: 158px; }
  #sliceNav { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  #sliceNav button { border: 0; background: transparent; color: var(--dim); cursor: pointer;
                     padding: 2px 5px; font-size: 13px; line-height: 1; }
  #sliceNav button:hover:not(:disabled) { color: var(--fg); }
  #sliceNav button:disabled { opacity: .28; cursor: default; }
  #sliceRange { flex: 1; appearance: none; height: 3px; border-radius: 2px;
                background: var(--line); cursor: pointer; }
  #sliceRange::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px;
                border-radius: 50%; background: var(--fg); cursor: pointer; }
  #sliceRange::-moz-range-thumb { width: 12px; height: 12px; border: 0;
                border-radius: 50%; background: var(--fg); cursor: pointer; }

  #layers { right: 316px; bottom: 22px; display: flex; align-items: center; gap: 14px;
            font-size: 12px; color: var(--dim); }
  #layers label { display: flex; align-items: center; gap: 7px; cursor: pointer;
                  padding: 6px 0; }
  #layers label:hover { color: var(--fg); }
  #layers input { appearance: none; width: 12px; height: 12px; margin: 0; cursor: pointer;
                  border: 1px solid #b9b5ac; border-radius: 3px; background: var(--panel); }
  #layers input:checked { background: var(--fg); border-color: var(--fg); }
  #reset { border: 0; background: transparent; color: var(--dim); cursor: pointer;
           padding: 6px 0; }
  #reset:hover { color: var(--fg); }

  .tag { position: fixed; z-index: 3; pointer-events: none; white-space: nowrap;
         font-size: 11px; transform: translate(-50%, -50%); opacity: 0;
         transition: opacity .18s; }
  .tag b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .tag.axis { font-size: 10.5px; letter-spacing: .04em; }
  .tag.match { color: var(--match); }

  #loading { position: fixed; inset: 0; display: grid; place-items: center;
             color: var(--dim); font-size: 12px; z-index: 4; pointer-events: none; }

  @media (max-width: 980px) {
    #slicePanel { display: none; }
    #layers { right: 24px; }
  }
  /* narrow: stack the header, and move the toggles up out of the legend column */
  @media (max-width: 620px) {
    #title { top: 14px; left: 16px; right: 16px; }
    #title h1 { font-size: 13px; }
    #controls { top: 62px; right: 16px; }
    .group > * { padding: 6px 9px; }
    #who { min-width: 62px; }
    #layers { top: 108px; right: 16px; bottom: auto; }
    #legend { left: 16px; bottom: 16px; max-width: calc(100vw - 32px); }
    #note { font-size: 10.5px; }
  }
  /* short: the slice inset and the method note do not fit */
  @media (max-height: 440px) {
    #slicePanel, #note { display: none; }
  }
  @media (max-height: 300px) {
    #legend { display: none; }
  }
</style>
</head>
<body>
<div id="stage"></div>

<div class="ui" id="title">
  <h1>Scapholunate distance</h1>
  <p id="subtitle">Automated 3D mapping from CT</p>
</div>

<div class="ui" id="controls">
  <div class="group">
    <button id="prev" title="Previous wrist" aria-label="Previous wrist">&lsaquo;</button>
    <div id="whoWrap"><span id="who">P01</span><select id="pick" aria-label="Wrist"></select></div>
    <button id="next" title="Next wrist" aria-label="Next wrist">&rsaquo;</button>
  </div>
  <div class="group">
    <button id="mPatient" aria-pressed="true">Wrist</button>
    <button id="mCohort" aria-pressed="false">All 25</button>
  </div>
</div>

<div class="ui" id="legend">
  <div id="scalebar"><div id="sbLine"></div><span id="sbText">5 mm</span></div>
  <div class="cap">Interval width</div>
  <div id="ramp"></div>
  <div class="row"><span id="lo"></span><span id="hi"></span></div>
  <p id="note"></p>
</div>

<div class="ui" id="layers">
  <label><input type="checkbox" id="lBones" checked> bones</label>
  <button id="reset">reset view</button>
</div>

<div class="ui" id="slicePanel">
  <div id="sliceBox">
    <div id="sliceHead"><span>Coronal slice</span><span id="sliceZ"></span></div>
    <svg id="sliceSvg" aria-label="Coronal cross section"></svg>
    <div id="sliceNav">
      <button id="sPrev" aria-label="Previous slice">&lsaquo;</button>
      <input type="range" id="sliceRange" min="0" max="0" value="0" aria-label="Slice">
      <button id="sNext" aria-label="Next slice">&rsaquo;</button>
    </div>
  </div>
</div>

<div id="loading">loading</div>
<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;margin:0;
padding:24px;text-align:center">This figure needs JavaScript. The underlying data and code
are in the repository linked from the paper.</p></noscript>

<script type="module" src="./app.js"></script>
</body>
</html>
